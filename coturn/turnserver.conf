# coturn config for the Phase 0 spike.  *** UNTESTED in the build sandbox (no Docker daemon there). ***
# Verify on a real host with test T3 in the README before relying on it.
#
# Secrets/addresses are passed on the command line by docker-compose.yml (coturn does not expand env vars):
#   --static-auth-secret=$TURN_SECRET  --realm=$TURN_REALM  --external-ip=$TURN_EXTERNAL_IP

listening-port=3478
tls-listening-port=5349        # forward 443 -> 5349 at the firewall for TURNS-on-443 (restrictive networks)
fingerprint
use-auth-secret                 # TURN REST scheme: time-limited HMAC credentials issued by the backend
stale-nonce=600

# Relay hygiene
no-cli
no-multicast-peers
no-tcp-relay                    # RFC 6062 TCP allocations are not needed for WebRTC
total-quota=100
user-quota=4
min-port=49160
max-port=49300

# Do not let relay allocations reach private/internal networks (SSRF-style abuse).
# NOTE: this also blocks relaying to peers on a private LAN. For same-LAN testing, comment these out temporarily.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TLS (needed for turns:). Mount certs at /certs.
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Privacy: keep no logs of allocations/peer IPs.
log-file=/dev/null
no-stdout-log
